name: Public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-pages
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
        working-directory: frontend
      - name: Build the tested project-subpath version
        run: npm run build:public
        working-directory: frontend
        env:
          VITE_BASE_PATH: /pipeline-doctor-ai/
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify the demo without any backend or provider requests
        run: npm run test:public
        working-directory: frontend
      - name: Build for the actual Pages or custom-domain base path
        run: npm run build:public
        working-directory: frontend
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
