name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: doctor_test
          POSTGRES_USER: doctor
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doctor -d doctor_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://doctor:ci-only-password@localhost:5432/doctor_test
      TEST_DATABASE_URL: postgresql+psycopg://doctor:ci-only-password@localhost:5432/doctor_test
      DEMO_MODE: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:///./browser.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --frozen --python 3.12
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - name: Start demo API without holding the uv cache lock
        run: |
          .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > "$RUNNER_TEMP/doctor-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/doctor-api.pid"
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for API
        run: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"
      - run: npm run test:e2e
        working-directory: frontend
      - name: Stop demo API before dependency-cache cleanup
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/doctor-api.pid"; then
            kill "$(cat "$RUNNER_TEMP/doctor-api.pid")" || true
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results
          retention-days: 3
