[project]
name = "pipeline-doctor-ai"
version = "0.1.0"
description = "AI-Powered GitLab CI/CD Troubleshooting"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46,<49",
  "filelock>=3.20,<4",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "langchain>=1,<2", "langchain-openai>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
